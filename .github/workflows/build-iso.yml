name: AlphaX ISO Build & CI

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validar Scripts, JSONC y Configuración
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run repository integrity checks
        run: bash ./scripts/check.sh

  build-iso:
    name: Compilar ISO AlphaX Linux (x86_64)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Liberar espacio en disco del Runner (35+ GB libres)
        run: |
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android \
                      /opt/ghc \
                      /opt/hostedtoolcache \
                      /usr/local/share/boost
          df -h

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Construir ISO en contenedor oficial Arch Linux
        run: |
          mkdir -p "$PWD/out"
          docker run --rm --privileged \
            -v "$PWD:/workspace" \
            -w /workspace \
            archlinux:latest \
            bash -euxo pipefail -c '
              sed -i "s/^#DisableSandbox/DisableSandbox/" /etc/pacman.conf
              grep -q "^DisableSandbox" /etc/pacman.conf || sed -i "/^\[options\]/a DisableSandbox" /etc/pacman.conf
              pacman-key --init
              pacman-key --populate archlinux
              pacman -Syu --noconfirm archiso grub dosfstools mtools libisoburn squashfs-tools git sudo
              ln -sfn /workspace/iso/alphax-profile/local-repo /tmp/alphax-local-repo
              chmod +x ./scripts/check.sh ./build.sh
              ./scripts/check.sh
              mkarchiso -v -w /tmp/archiso-work -o /workspace/out /workspace/iso/alphax-profile
              cd /workspace/out
              for iso in *.iso; do
                sha256sum "$iso" > "${iso}.sha256"
              done
              ls -lh /workspace/out
            '

      - name: Subir ISO como Artifact de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: AlphaX-Linux-ISO-x86_64
          path: |
            out/*.iso
            out/*.iso.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Preparar archivos para GitHub Releases (límite 2 GiB por archivo)
        if: github.event_name == 'push'
        run: |
          mkdir -p out-release
          cp -f out/*.sha256 out-release/ 2>/dev/null || true
          for iso in out/*.iso; do
            [ -f "$iso" ] || continue
            size=$(stat -c%s "$iso")
            echo "Tamaño de $iso: $size bytes"
            if [ "$size" -lt 2140000000 ]; then
              echo "ISO < 2 GiB: subiendo archivo .iso directo a GitHub Releases"
              cp -f "$iso" out-release/
            else
              echo "ISO >= 2 GiB: dividiendo en partes de 1900M para cumplir límite de GitHub Releases"
              split -b 1900M -d "$iso" "out-release/$(basename "$iso").part"
            fi
          done
          ls -lh out-release/

      - name: Publicar ISO en GitHub Releases (v1.0.0)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "⚡ AlphaX Linux v1.0.0 — Gaming Edition (Codex WM / Kernel Zen)"
          body: |
            ## ⚡ AlphaX Linux v1.0.0 — Gaming Edition (`x86_64`)
            ISO oficial de **AlphaX Linux** compilada automáticamente con:
            - **Kernel:** `linux-zen` (Low-Latency Gaming + `nowatchdog tsc=reliable split_lock_detect=off`)
            - **Escritorio:** **Codex WM** (Hyprland + Waybar + Rofi + SwayNC + Tema *Tokyo Night*)
            - **Modo Competitivo Zero-Lag:** `SUPER + G` (0 Blur/Animaciones + Tearing ON)
            - **AlphaX Control Center:** `SUPER + A` / `alphax` (Instalador de Proton-GE en 1 clic, Gobernador CPU, Auto-Drivers GPU)
            - **Bootloader & Splash:** Tema GRUB **Touhou Project - Komeiji Koishi** + Animación de inicio **Plymouth** estilo Zorin OS
            - **Tuning incluido:** SteamOS `vm.max_map_count = 2147483642`, Red **TCP BBR + fq**, Swap **ZRAM (`zstd`)** y reglas `udev` NVMe/SSD
            - **Credenciales Live:** Usuario `liveuser` / Contraseña `liveuser`
            - *(Nota: Si la ISO en Assets aparece dividida en `.part00` y `.part01` por el límite de 2 GB de GitHub Releases, únelas en Linux con `cat alphax-*.iso.part* > alphax.iso` o en Windows CMD con `copy /b alphax-*.iso.part00 + alphax-*.iso.part01 alphax.iso`, o descarga el `.zip` directo desde el Artifact del Workflow).*
          files: |
            out-release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
