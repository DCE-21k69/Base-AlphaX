LABEL arch_nbd
TEXT HELP
Boot AlphaX Linux live medium (Using NBD).
ENDTEXT
MENU LABEL AlphaX Linux (%ARCH%, NBD)
LINUX ::/%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD ::/%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% archiso_nbd_srv=${pxeserver} cms_verify=y nowatchdog split_lock_detect=off
SYSAPPEND 3

