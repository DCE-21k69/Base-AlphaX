# Load partition table and file system modules
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ntfs
insmod ntfscomp
insmod exfat
insmod udf

# Cargar fuentes y tema gráfico Komeiji Koishi (AlphaX Edition)
if loadfont "${prefix}/fonts/unicode.pf2" ; then
    insmod all_video
    insmod gfxterm
    insmod gfxmenu
    insmod png
    set gfxmode="1920x1080,auto"
    terminal_input console
    terminal_output gfxterm
    if [ -f "${prefix}/themes/komeiji_koishi/theme.txt" ]; then
        loadfont "${prefix}/themes/komeiji_koishi/font/CascadiaCode_18.pf2"
        loadfont "${prefix}/themes/komeiji_koishi/font/comic_16.pf2"
        loadfont "${prefix}/themes/komeiji_koishi/font/comic_26.pf2"
        set theme="${prefix}/themes/komeiji_koishi/theme.txt"
        export theme
    elif [ -f "${prefix}/splash.png" ]; then
        background_image -m stretch "${prefix}/splash.png"
    fi
fi

# Colores de respaldo
set menu_color_normal=light-cyan/black
set menu_color_highlight=black/light-magenta
set color_normal=light-cyan/black
set color_highlight=black/light-magenta

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=alphax
timeout=10
timeout_style=menu

# Menu entries
menuentry "AlphaX Linux Gaming (${archiso_platform})" --class alphax --class arch --class gnu-linux --class gnu --class os --id 'alphax' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% quiet splash loglevel=3 nowatchdog tsc=reliable split_lock_detect=off
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
}

if [ "${grub_platform}" == 'efi' -a "${grub_cpu}" == 'x86_64' -a -f '/boot/memtest86+/memtest.efi' ]; then
    menuentry 'Memtest86+ (RAM Test)' --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest.efi
    }
fi
if [ "${grub_platform}" == 'pc' -a -f '/boot/memtest86+/memtest' ]; then
    menuentry 'Memtest86+ (RAM Test)' --class memtest --class gnu --class tool {
        set gfxpayload=800x600,1024x768
        linux /boot/memtest86+/memtest
    }
fi
if [ "${grub_platform}" == 'efi' ]; then
    if [ "${grub_cpu}" == 'x86_64' -a -f '/shellx64.efi' ]; then
        menuentry 'UEFI Interactive Shell' --class efi {
            chainloader /shellx64.efi
        }
    fi
    menuentry 'UEFI Firmware Settings' --class driver --id 'uefi-firmware' {
        fwsetup
    }
fi

menuentry 'Reiniciar Sistema' --class restart --class reboot {
    echo 'Reiniciando AlphaX Linux...'
    reboot
}

menuentry 'Apagar Sistema' --class shutdown --class poweroff {
    echo 'Apagando AlphaX Linux...'
    halt
}
