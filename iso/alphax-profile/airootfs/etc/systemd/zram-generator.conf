# ═══════════════════════════════════════════════════════════════════
# AlphaX Linux — ZRAM Swap Comprimido de Alta Velocidad (zstd)
# ═══════════════════════════════════════════════════════════════════
[zram0]
zram-size = min(ram / 2, 8192)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
