# ═══════════════════════════════════════════════════════════════════
# AlphaX Linux — Tuning de Kernel, Memoria y Red para Gaming (Low-Latency)
# ═══════════════════════════════════════════════════════════════════

# --- Memoria Virtual (Estándar SteamOS / Proton / Wine) ---
# Obligatorio para evitar crashes en juegos modernos bajo Wine/Proton y motores Source 2 / Unreal
vm.max_map_count = 2147483642

# Priorizar RAM física sobre swap y reducir bloqueos de escritura en disco durante partidas
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5
vm.compaction_proactiveness = 0
vm.page_lock_unfairness = 1

# --- CPU y Scheduler de Baja Latencia ---
# Desactivar mitigación de split-lock (evita caídas drásticas de FPS en juegos de Windows/Proton)
kernel.split_lock_mitigate = 0

# Desactivar NMI Watchdog para reducir interrupciones de hardware en los núcleos de CPU
kernel.nmi_watchdog = 0

# Agrupación automática de tareas para mantener fluidez del escritorio bajo carga
kernel.sched_autogroup_enabled = 1

# --- Red Competitiva (TCP BBR + Fair Queueing — Menor Ping/Bufferbloat) ---
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_mtu_probing = 1
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 8192
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
