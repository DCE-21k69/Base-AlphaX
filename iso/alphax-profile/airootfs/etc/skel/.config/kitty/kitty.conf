# AlphaX - Kitty Terminal Config

# Fastfetch al iniciar
startup_session ~/.config/kitty/startup.conf

# Fuente
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
font_size        12.0

# Colores AlphaX (Tokyo Night)
background            #1a1b26
foreground            #c0caf5
selection_background  #33467c
selection_foreground  #c0caf5

# Colores normales
color0  #15161e
color1  #f7768e
color2  #9ece6a
color3  #e0af68
color4  #7aa2f7
color5  #bb9af7
color6  #7dcfff
color7  #a9b1d6

# Colores brillantes
color8  #414868
color9  #f7768e
color10 #9ece6a
color11 #e0af68
color12 #7aa2f7
color13 #bb9af7
color14 #7dcfff
color15 #c0caf5

# Cursor
cursor                #c0caf5
cursor_shape          beam
cursor_beam_thickness 1.5

# Ventana
window_padding_width  12
background_opacity    0.95

# Tabs
tab_bar_style         powerline
tab_powerline_style   slanted
active_tab_foreground   #1a1b26
active_tab_background   #bb9af7
inactive_tab_foreground #545c7e
inactive_tab_background #1a1b26

# Sin barra de titulo
hide_window_decorations no