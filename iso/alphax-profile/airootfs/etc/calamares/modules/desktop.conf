---
componentName: desktop

desktops:
  - id: kde
    name: "KDE Plasma"
    description: "Escritorio moderno y completo. Recomendado para la mayoría de usuarios."
    packages:
      - plasma-meta
      - sddm
      - kde-applications-meta
    default: true

  - id: gnome
    name: "GNOME"
    description: "Escritorio limpio y elegante, fácil de usar."
    packages:
      - gnome
      - gnome-extra
      - gdm

  - id: xfce
    name: "XFCE"
    description: "Ligero y rápido, ideal para PCs con pocos recursos."
    packages:
      - xfce4
      - xfce4-goodies
      - lightdm
      - lightdm-gtk-greeter

  - id: codex
    name: "Codex WM  ⚠ Experimental"
    description: "Window manager Wayland de AlphaX. Tiling/Mosaico, barra custom. En desarrollo activo."
    packages:
      - hyprland
      - waybar
      - kitty
      - rofi-wayland
      - hyprpaper
      - sddm
    default: false

  - id: minimal
    name: "Sin entorno gráfico"
    description: "Solo la base del sistema, sin interfaz gráfica. Para usuarios avanzados."
    packages:
      - vim
      - networkmanager
    default: false
