# Codex WM — AlphaX Linux

# Monitor
monitor=,preferred,auto,1

# Autostart
exec-once = waybar -c ~/.config/codex/bar/config.jsonc -s ~/.config/codex/bar/style.css
exec-once = hyprpaper

# Variables de entorno
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORMTHEME,qt6ct

# Input
input {
    kb_layout = latam
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

# Apariencia general
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(7aa2f7ff) rgba(bb9af7ff) 45deg
    col.inactive_border = rgba(1a1b26aa)
    layout = dwindle
}

# Decoracion de ventanas
decoration {
    rounding = 8
    blur {
        enabled = true
        size = 8
        passes = 2
        vibrancy = 0.2
    }
    shadow {
        enabled = true
        range = 15
        color = rgba(1a1b26cc)
    }
}

# Animaciones
animations {
    enabled = true
    bezier = codex, 0.05, 0.9, 0.1, 1.05
    bezier = smooth, 0.4, 0, 0.2, 1
    animation = windows, 1, 5, codex
    animation = windowsOut, 1, 4, smooth, popin 80%
    animation = fade, 1, 4, smooth
    animation = workspaces, 1, 5, smooth, slidevert
}

# Layout tiling (dwindle)
dwindle {
    pseudotile = true
    preserve_split = true
}

# Workspaces
workspace = 1, name:main
workspace = 2, name:code
workspace = 3, name:game
workspace = 4, name:media
workspace = 5, name:misc

# ═══════════════════════════════
#  KEYBINDS
# ═══════════════════════════════
$mod = SUPER

# Apps básicas
bind = $mod, Return, exec, kitty
bind = $mod, E, exec, dolphin
bind = $mod, D, exec, rofi -show drun
bind = $mod, Q, killactive

# Toggle layout tiling/mosaico
bind = $mod, T, exec, ~/.config/codex/scripts/toggle-layout.sh

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

# Mover ventana a workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# Mover foco entre ventanas
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

# Mover ventanas
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, down, movewindow, d

# Fullscreen y float
bind = $mod, F, fullscreen
bind = $mod SHIFT, F, togglefloating

# Resize
bind = $mod CTRL, right, resizeactive, 50 0
bind = $mod CTRL, left, resizeactive, -50 0
bind = $mod CTRL, up, resizeactive, 0 -50
bind = $mod CTRL, down, resizeactive, 0 50

# Screenshot
bind = , Print, exec, grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%Y%m%d-%H%M%S).png

# Volumen
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Mouse en ventanas flotantes
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow
